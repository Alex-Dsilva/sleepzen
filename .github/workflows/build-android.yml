name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:   # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install JS dependencies
      - name: Install npm dependencies
        run: npm ci

      # 4. Set up Java 17 (required by Gradle/Android)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Generate the native android/ directory with expo prebuild
      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # 6. Cache Gradle for faster subsequent builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 7. Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 8. Build debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. Upload APK as build artifact (always available for 30 days)
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLEEPZEN-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 10. Create a GitHub Release with the APK attached (on push to main/master)
      - name: Get date for release tag
        id: date
        run: echo "TAG=v1.0-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.TAG }}
          name: "SLEEPZEN ${{ steps.date.outputs.TAG }}"
          body: |
            ## 🌙 SLEEPZEN Android App

            **Install directly on your Android phone:**
            1. Download the APK file below
            2. On your Android phone, go to **Settings → Security → Install unknown apps** and allow your browser or file manager
            3. Open the downloaded APK and tap **Install**

            ---
            Built automatically from the latest source on every push.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
